# =============================================================================
# policy_matrix.yaml
# =============================================================================
# Central configuration for the runtime-authorization experiment:
#
#   1. dimensions              - the enumerations used by every other section
#   2. ground_truth_matrix     - the independently authored label matrix
#                                (draft section IV.C) that gives scenarios their
#                                ground-truth authorization labels
#   3. risk_model              - weights and ordinal mappings of
#                                R = w_s*S + w_a*A + w_e*E + w_c*C (section III.D)
#   4. thresholds              - T1 / T2 of the three-way decision rule
#                                (section III.E) and the sensitivity grid
#                                (section IV.G)
#   5. abac_baseline           - the deterministic binary baseline (section IV.D)
#   6. metrics                 - analysis inputs not fixed by the manuscript
#
# STATUS: PILOT-CALIBRATED.  The qualitative ground-truth policy rules and
# deterministic binary ABAC baseline are authored, and the risk configuration
# has been selected using only the separate 24-case pilot dataset.
# Its binary rule set is derived from the ground-truth rules by the documented,
# deterministic projection in src/policy.py, governed by the authored
# `escalation_collapse` and `context_assumption` design decisions. Calibration
# provenance and the complete candidate grids are in data/risk_config.yaml.
#
# The only concrete numbers present anywhere in this file are the threshold
# sensitivity ranges, which are carried over verbatim from the manuscript draft
# (section IV.G) and are marked as such.  They are NOT the preregistered pair.
# =============================================================================

_meta:
  file: data/policy_matrix.yaml
  schema_version: "0.1.0"
  status: pilot-calibrated
  # Flip to true only once every null below has been authored and frozen
  # before the primary experiment is run.
  locked_for_primary_experiment: false
  author: TBD
  created_for: "Risk-Adaptive Escalation for Tool-Using AI Agents (pre-results draft)"
  pending_authoring:
    - metrics.low_risk_definition
  # NOTE: abac_baseline is authored (see section 5); it is intentionally absent
  # from this list.
  authored_abac_baseline:
    rules_source: ground_truth_projection
    escalation_collapse: DENY
    context_assumption: NORMAL
  provenance_note: >-
    Labels and policy outcomes must originate from the matrix below and a second
    independent reviewer (section IV.C), never from the risk score, and never
    from an LLM.  ContextRisk is likewise supplied per scenario.

# -----------------------------------------------------------------------------
# 1. Dimensions
# -----------------------------------------------------------------------------
# These enumerations mirror the strongly typed enums in src/models.py exactly.
# The loader rejects any drift between this file and the code.
dimensions:
  role: [ANALYST, MANAGER, ADMINISTRATOR]
  tool: [READ_RECORD, UPDATE_RECORD, EXPORT_DATA, SEND_MESSAGE, DELETE_RECORD]
  sensitivity: [INTERNAL, CONFIDENTIAL, RESTRICTED]
  destination: [INTERNAL, CONTROLLED_EXTERNAL, EXTERNAL]
  context_risk: [NORMAL, UNUSUAL, HIGH_VOLUME, ANOMALOUS]

# -----------------------------------------------------------------------------
# 2. Ground-truth matrix  (draft section IV.C)
# -----------------------------------------------------------------------------
# Expected behavior by role, tool/operation, information sensitivity, exposure
# destination, and (where relevant) contextual condition.
#
# Rule schema:
#   rule_id     : unique string
#   decision    : ALLOW | ESCALATE | DENY
#   match       : attribute -> list of accepted values, or null for "any value"
#                 (attributes: role, tool, sensitivity, destination, context_risk)
#   description : human-readable statement of the rule
#   rationale   : why the rule is stated that way (audit trail)
#   priority    : optional integer; rules are evaluated by (priority, file order),
#                 first match wins
ground_truth_matrix:
  description: >-
    Expected authorization behavior used to label scenarios.  This matrix is
    specified independently of the risk score and is based only on qualitative
    security policy principles.
  label_source: "primary author + one independent second reviewer (Cohen's kappa)"
  rationale_required: true
  independence_statement: >-
    These rules were authored as qualitative access-control policy statements.
    They do not use risk weights, ordinal factor mappings, T1/T2 thresholds, or
    any later numerical risk-score output.
  policy_principles:
    least_privilege: >-
      Analysts receive only routine operational access; managers receive
      broader business authority; administrators receive system authority but
      are still constrained by disclosure and destructive-action controls.
    data_sensitivity: >-
      Restricted data receives stronger protection than Confidential data, and
      Confidential data receives stronger protection than Internal data.
    role_authority: >-
      Higher role authority may justify approval workflows, but it does not
      override prohibited disclosure, anomalous behavior, or destructive-action
      safeguards.
    operation_side_effects: >-
      Reading is treated as lower side effect than messaging, updating,
      exporting, or deleting.  Updates affect integrity; exports and messages
      disclose data; deletes are destructive.
    external_disclosure: >-
      Unmanaged external disclosure is prohibited for Restricted data and for
      Confidential bulk export.  Controlled external disclosure may be valid
      for authorized roles but often requires approval.
    bulk_operations: >-
      High-volume reads or exports are treated as bulk behavior and require
      approval unless a stricter prohibition applies.
    contextual_anomaly: >-
      Anomalous context blocks high-impact, external, or Restricted operations.
      Residual low-impact internal anomalous activity requires escalation.
    destructive_actions: >-
      Deletes require human approval for Internal or Confidential data and are
      prohibited for Restricted data or non-internal destinations.
  precedence:
    - "Priority 10 DENY rules express hard prohibitions."
    - "Priority 20 ESCALATE rules express legitimate-but-not-auto-approvable cases."
    - "Priority 80 ALLOW rules express routine least-privilege operations."
    - "Priority 99 is a fail-closed catch-all DENY."
  conflict_resolution: >-
    Rules are evaluated deterministically by ascending priority and then file
    order; the first matching rule wins.  Therefore a DENY prohibition always
    overrides a later ESCALATE or ALLOW rule, and an ESCALATE boundary always
    overrides a later routine ALLOW rule.
  escalate_cases:
    - "Restricted internal reads by Analysts."
    - "Confidential updates by Analysts."
    - "Restricted updates or exports by Managers."
    - "Restricted exports by Administrators."
    - "Controlled external disclosure of Confidential or Restricted data by authorized roles."
    - "Unmanaged external disclosure of Internal data by Managers or Administrators."
    - "High-volume reads or exports not otherwise prohibited."
    - "Unusual context for sensitive, side-effecting, or externally scoped actions."
    - "Residual anomalous low-impact internal activity."
    - "Internal deletes of Internal or Confidential data by Managers or Administrators."
  rules:
    - rule_id: GT-D001
      decision: DENY
      priority: 10
      match:
        destination: [CONTROLLED_EXTERNAL, EXTERNAL]
        context_risk: [ANOMALOUS]
      description: "Anomalous behavior cannot cross organizational disclosure boundaries."
      rationale: >-
        An anomalous context combined with any external or partner destination
        is prohibited rather than routed to automatic approval.

    - rule_id: GT-D002
      decision: DENY
      priority: 10
      match:
        tool: [UPDATE_RECORD, EXPORT_DATA, DELETE_RECORD]
        context_risk: [ANOMALOUS]
      description: "Anomalous high-impact operations are prohibited."
      rationale: >-
        Integrity-changing, bulk-disclosure, and destructive operations are not
        safe to execute under anomalous context.

    - rule_id: GT-D003
      decision: DENY
      priority: 10
      match:
        sensitivity: [RESTRICTED]
        context_risk: [ANOMALOUS]
      description: "Anomalous access to Restricted data is prohibited."
      rationale: >-
        Restricted data requires a stronger response to contextual anomaly than
        routine manual approval.

    - rule_id: GT-D004
      decision: DENY
      priority: 10
      match:
        sensitivity: [RESTRICTED]
        destination: [EXTERNAL]
      description: "Restricted data may not be sent to unmanaged external destinations."
      rationale: >-
        External disclosure of Restricted data is outside the permitted policy
        envelope regardless of role or operation.

    - rule_id: GT-D005
      decision: DENY
      priority: 10
      match:
        tool: [EXPORT_DATA]
        sensitivity: [CONFIDENTIAL]
        destination: [EXTERNAL]
      description: "Confidential bulk export to unmanaged external destinations is prohibited."
      rationale: >-
        Bulk export creates a broad disclosure path that is not acceptable for
        Confidential information outside managed channels.

    - rule_id: GT-D006
      decision: DENY
      priority: 10
      match:
        role: [ANALYST]
        sensitivity: [RESTRICTED]
        tool: [UPDATE_RECORD, EXPORT_DATA, SEND_MESSAGE]
      description: "Analysts may not modify or disclose Restricted data."
      rationale: >-
        Analyst authority is limited to routine work and does not include
        Restricted-data modification, export, or messaging.

    - rule_id: GT-D007
      decision: DENY
      priority: 10
      match:
        role: [ANALYST]
        sensitivity: [RESTRICTED]
        destination: [CONTROLLED_EXTERNAL]
      description: "Analysts may not route Restricted data to controlled external parties."
      rationale: >-
        Partner-channel handling of Restricted data requires higher role
        authority and approval.

    - rule_id: GT-D008
      decision: DENY
      priority: 10
      match:
        role: [ANALYST]
        destination: [EXTERNAL]
        tool: [EXPORT_DATA, SEND_MESSAGE]
      description: "Analysts may not disclose data to unmanaged external destinations."
      rationale: >-
        Least privilege excludes unmanaged external disclosure by Analysts.

    - rule_id: GT-D009
      decision: DENY
      priority: 10
      match:
        role: [ANALYST]
        tool: [DELETE_RECORD]
      description: "Analysts may not delete records."
      rationale: >-
        Delete authority is destructive and outside Analyst privileges.

    - rule_id: GT-D010
      decision: DENY
      priority: 10
      match:
        tool: [DELETE_RECORD]
        sensitivity: [RESTRICTED]
      description: "Restricted records may not be deleted through this automated path."
      rationale: >-
        Restricted deletes are prohibited in the modeled runtime authorization
        policy rather than merely escalated.

    - rule_id: GT-D011
      decision: DENY
      priority: 10
      match:
        tool: [DELETE_RECORD]
        destination: [CONTROLLED_EXTERNAL, EXTERNAL]
      description: "Deletes are prohibited for non-internal destinations."
      rationale: >-
        Destructive actions must remain inside internal administrative channels.

    - rule_id: GT-D012
      decision: DENY
      priority: 10
      match:
        tool: [EXPORT_DATA]
        sensitivity: [RESTRICTED]
        context_risk: [HIGH_VOLUME]
      description: "High-volume Restricted exports are prohibited."
      rationale: >-
        Bulk export of Restricted data creates unacceptable disclosure impact.

    - rule_id: GT-D013
      decision: DENY
      priority: 10
      match:
        role: [ANALYST]
        tool: [EXPORT_DATA]
        sensitivity: [CONFIDENTIAL, RESTRICTED]
        context_risk: [HIGH_VOLUME]
      description: "Analyst high-volume export of sensitive data is prohibited."
      rationale: >-
        High-volume sensitive exports exceed Analyst authority.

    - rule_id: GT-E001
      decision: ESCALATE
      priority: 20
      match:
        context_risk: [ANOMALOUS]
      description: "Residual anomalous activity requires human review."
      rationale: >-
        Any anomalous case not already prohibited may be legitimate but cannot
        be safely permitted automatically.

    - rule_id: GT-E002
      decision: ESCALATE
      priority: 20
      match:
        context_risk: [HIGH_VOLUME]
        tool: [READ_RECORD, EXPORT_DATA]
      description: "High-volume reads or exports require approval."
      rationale: >-
        Bulk access can amplify disclosure even when the operation is otherwise
        legitimate.

    - rule_id: GT-E003
      decision: ESCALATE
      priority: 20
      match:
        context_risk: [HIGH_VOLUME]
        sensitivity: [CONFIDENTIAL, RESTRICTED]
      description: "High-volume handling of sensitive data requires approval."
      rationale: >-
        Sensitive data in bulk form needs reviewer confirmation unless a DENY
        rule has already prohibited the action.

    - rule_id: GT-E004
      decision: ESCALATE
      priority: 20
      match:
        context_risk: [UNUSUAL]
        sensitivity: [CONFIDENTIAL, RESTRICTED]
      description: "Unusual sensitive-data access requires approval."
      rationale: >-
        Sensitive operations under atypical conditions may be legitimate but
        should not be auto-approved.

    - rule_id: GT-E005
      decision: ESCALATE
      priority: 20
      match:
        context_risk: [UNUSUAL]
        tool: [UPDATE_RECORD, EXPORT_DATA, SEND_MESSAGE, DELETE_RECORD]
      description: "Unusual side-effecting operations require approval."
      rationale: >-
        Integrity-changing, disclosure, or destructive operations require
        additional scrutiny under unusual context.

    - rule_id: GT-E006
      decision: ESCALATE
      priority: 20
      match:
        context_risk: [UNUSUAL]
        destination: [CONTROLLED_EXTERNAL, EXTERNAL]
      description: "Unusual external-scope operations require approval."
      rationale: >-
        External scope under atypical conditions needs an explicit reviewer.

    - rule_id: GT-E007
      decision: ESCALATE
      priority: 20
      match:
        role: [MANAGER, ADMINISTRATOR]
        destination: [EXTERNAL]
        sensitivity: [INTERNAL]
        tool: [EXPORT_DATA, SEND_MESSAGE]
      description: "Authorized unmanaged external disclosure of Internal data requires approval."
      rationale: >-
        The content is lower sensitivity, but unmanaged external disclosure
        should be reviewed.

    - rule_id: GT-E008
      decision: ESCALATE
      priority: 20
      match:
        role: [MANAGER, ADMINISTRATOR]
        destination: [EXTERNAL]
        sensitivity: [CONFIDENTIAL]
        tool: [READ_RECORD, SEND_MESSAGE]
      description: "Confidential non-bulk unmanaged external disclosure requires approval."
      rationale: >-
        Confidential data may have exceptional external uses, but not without
        explicit authorization.

    - rule_id: GT-E009
      decision: ESCALATE
      priority: 20
      match:
        role: [MANAGER, ADMINISTRATOR]
        destination: [CONTROLLED_EXTERNAL]
        sensitivity: [CONFIDENTIAL, RESTRICTED]
        tool: [READ_RECORD, UPDATE_RECORD, EXPORT_DATA, SEND_MESSAGE]
      description: "Controlled external handling of sensitive data requires approval."
      rationale: >-
        Managed partner channels can be legitimate, but sensitive data crossing
        the boundary requires approval.

    - rule_id: GT-E010
      decision: ESCALATE
      priority: 20
      match:
        role: [ANALYST]
        destination: [CONTROLLED_EXTERNAL]
        sensitivity: [CONFIDENTIAL]
        tool: [READ_RECORD, EXPORT_DATA, SEND_MESSAGE]
      description: "Analyst controlled-external handling of Confidential data requires approval."
      rationale: >-
        Analyst workflows may involve partner channels, but Confidential data
        disclosure requires authorization.

    - rule_id: GT-E011
      decision: ESCALATE
      priority: 20
      match:
        role: [ANALYST]
        sensitivity: [RESTRICTED]
        destination: [INTERNAL]
        tool: [READ_RECORD]
      description: "Analyst internal reads of Restricted data require approval."
      rationale: >-
        Restricted read access may be legitimate for a specific investigation
        but exceeds routine Analyst authority.

    - rule_id: GT-E012
      decision: ESCALATE
      priority: 20
      match:
        role: [ANALYST]
        sensitivity: [CONFIDENTIAL]
        destination: [INTERNAL]
        tool: [UPDATE_RECORD]
      description: "Analyst updates to Confidential records require approval."
      rationale: >-
        Confidential integrity changes need managerial or human approval.

    - rule_id: GT-E013
      decision: ESCALATE
      priority: 20
      match:
        role: [ANALYST]
        sensitivity: [CONFIDENTIAL]
        destination: [INTERNAL]
        tool: [EXPORT_DATA]
      description: "Analyst internal exports of Confidential data require approval."
      rationale: >-
        Exporting Confidential data creates a bulk-disclosure concern even when
        the destination remains internal.

    - rule_id: GT-E014
      decision: ESCALATE
      priority: 20
      match:
        role: [MANAGER]
        sensitivity: [RESTRICTED]
        destination: [INTERNAL]
        tool: [UPDATE_RECORD, EXPORT_DATA]
      description: "Manager updates or exports of Restricted data require approval."
      rationale: >-
        Manager authority can support the workflow, but Restricted integrity
        changes and exports are not auto-approved.

    - rule_id: GT-E015
      decision: ESCALATE
      priority: 20
      match:
        role: [ADMINISTRATOR]
        sensitivity: [RESTRICTED]
        destination: [INTERNAL]
        tool: [EXPORT_DATA]
      description: "Administrator exports of Restricted data require approval."
      rationale: >-
        Administrative authority does not remove approval requirements for
        Restricted-data export.

    - rule_id: GT-E016
      decision: ESCALATE
      priority: 20
      match:
        role: [MANAGER, ADMINISTRATOR]
        tool: [DELETE_RECORD]
        sensitivity: [INTERNAL, CONFIDENTIAL]
        destination: [INTERNAL]
      description: "Internal deletes by authorized roles require approval."
      rationale: >-
        Deletes are destructive; valid delete workflows require human approval.

    - rule_id: GT-A001
      decision: ALLOW
      priority: 80
      match:
        role: [ADMINISTRATOR]
        destination: [INTERNAL]
        context_risk: [NORMAL]
        tool: [READ_RECORD, UPDATE_RECORD, EXPORT_DATA, SEND_MESSAGE]
      description: "Administrators may perform routine non-delete internal operations."
      rationale: >-
        Administrative role authority covers normal internal operations unless
        an earlier disclosure or Restricted-export boundary applies.

    - rule_id: GT-A002
      decision: ALLOW
      priority: 80
      match:
        role: [MANAGER]
        destination: [INTERNAL]
        context_risk: [NORMAL]
        sensitivity: [INTERNAL, CONFIDENTIAL]
        tool: [READ_RECORD, UPDATE_RECORD, EXPORT_DATA, SEND_MESSAGE]
      description: "Managers may perform routine internal operations on Internal or Confidential data."
      rationale: >-
        Manager authority covers normal internal business operations on data up
        to Confidential sensitivity.

    - rule_id: GT-A003
      decision: ALLOW
      priority: 80
      match:
        role: [MANAGER]
        destination: [INTERNAL]
        context_risk: [NORMAL]
        sensitivity: [RESTRICTED]
        tool: [READ_RECORD, SEND_MESSAGE]
      description: "Managers may read or internally message Restricted data in normal context."
      rationale: >-
        Managers have business authority for limited internal Restricted-data
        handling, while Restricted updates and exports require approval.

    - rule_id: GT-A004
      decision: ALLOW
      priority: 80
      match:
        role: [ANALYST]
        destination: [INTERNAL]
        context_risk: [NORMAL]
        sensitivity: [INTERNAL, CONFIDENTIAL]
        tool: [READ_RECORD, SEND_MESSAGE]
      description: "Analysts may read or internally message non-Restricted data in normal context."
      rationale: >-
        Routine Analyst workflows include reading and internal messaging for
        Internal and Confidential data.

    - rule_id: GT-A005
      decision: ALLOW
      priority: 80
      match:
        role: [ANALYST]
        destination: [INTERNAL]
        context_risk: [NORMAL]
        sensitivity: [INTERNAL]
        tool: [UPDATE_RECORD, EXPORT_DATA]
      description: "Analysts may update or internally export Internal data in normal context."
      rationale: >-
        Internal-data updates and internal exports are within routine Analyst
        authority when no unusual context is present.

    - rule_id: GT-A006
      decision: ALLOW
      priority: 80
      match:
        destination: [CONTROLLED_EXTERNAL]
        context_risk: [NORMAL]
        sensitivity: [INTERNAL]
        role: [ANALYST, MANAGER, ADMINISTRATOR]
        tool: [READ_RECORD, SEND_MESSAGE]
      description: "Internal data may be read or messaged through controlled external channels."
      rationale: >-
        Controlled external channels are acceptable for low-sensitivity
        routine disclosure when the operation is not bulk export.

    - rule_id: GT-A007
      decision: ALLOW
      priority: 80
      match:
        destination: [CONTROLLED_EXTERNAL]
        context_risk: [NORMAL]
        sensitivity: [INTERNAL]
        role: [MANAGER, ADMINISTRATOR]
        tool: [EXPORT_DATA]
      description: "Managers and Administrators may export Internal data to controlled external channels."
      rationale: >-
        Higher role authority supports normal controlled-partner export of
        Internal data.

    - rule_id: GT-D999
      decision: DENY
      priority: 99
      match: {}
      description: "Fail-closed default for cases not explicitly permitted or escalated."
      rationale: >-
        Unmatched combinations are not automatically legitimate.  They remain
        prohibited until the qualitative policy is explicitly extended.

# -----------------------------------------------------------------------------
# 3. Risk model  (draft section III.D)
# -----------------------------------------------------------------------------
risk_model:
  formula: "R = w_s*S + w_a*A + w_e*E + w_c*C"
  # Order here mirrors the manuscript: S, A, E, C.
  weights:
    sensitivity: 0.25
    action_severity: 0.25
    exposure_scope: 0.25
    contextual_risk: 0.25
  # Constraint enforced by the loader: the four weights must sum to 1.0.
  weight_constraint: "sum(weights) == 1.0"
  weight_locked: true
  # Each component maps its source dimension's ordinal members onto [0, 1].
  component_sources:
    sensitivity: sensitivity
    action_severity: tool
    exposure_scope: destination
    contextual_risk: context_risk
  factor_mappings:
    sensitivity:
      INTERNAL: 0.0
      CONFIDENTIAL: 0.5
      RESTRICTED: 1.0
    action_severity:
      READ_RECORD: 0.0
      UPDATE_RECORD: 0.5
      EXPORT_DATA: 0.75
      SEND_MESSAGE: 0.5
      DELETE_RECORD: 1.0
    exposure_scope:
      INTERNAL: 0.0
      CONTROLLED_EXTERNAL: 0.5
      EXTERNAL: 1.0
    contextual_risk:
      NORMAL: 0.0
      UNUSUAL: 0.33
      HIGH_VOLUME: 0.67
      ANOMALOUS: 1.0
  mapping_range: [0.0, 1.0]
  note: >-
    Selected by the reproducible pilot-only procedure in src/calibration.py and
    recorded with full provenance in data/risk_config.yaml. Contextual risk
    comes from the scenario record; it is never inferred by a model.

# -----------------------------------------------------------------------------
# 4. Thresholds  (draft sections III.E and IV.G)
# -----------------------------------------------------------------------------
thresholds:
  decision_function:
    ALLOW: "R < T1"
    ESCALATE: "T1 <= R < T2"
    DENY: "R >= T2"
  T1_escalation: 0.20
  T2_denial: 0.50
  constraint: "T1 < T2"
  preregistered: true
  # Sensitivity-analysis ranges, copied verbatim from draft section IV.G.
  # These are illustrative ranges for the robustness check, not the primary pair.
  sensitivity_grid:
    T1: [0.30, 0.40, 0.50]
    T2: [0.60, 0.70, 0.80]
  grid_source: "draft section IV.G (example ranges; combinations must satisfy T1 < T2)"

# -----------------------------------------------------------------------------
# 5. Deterministic binary ABAC baseline  (draft section IV.D)
# -----------------------------------------------------------------------------
# The baseline is the same independently authored security policy evaluated on
# the four attributes a deterministic binary mechanism can observe.  It has no
# ESCALATE state: ground-truth ESCALATE outcomes are forced to ALLOW or DENY by
# `escalation_collapse` below.  Ground-truth ESCALATE scenarios are NOT removed
# from evaluation; src/evaluator.py records, per scenario, which way
# each one was forced so they can be analysed separately later.
#
# rules_source:
#   ground_truth_projection
#       Derive the binary rule set from ground_truth_matrix.rules with
#       src.policy.project_binary_baseline_rules().  The projection is a pure
#       function of the ground-truth rules plus the two authored design
#       decisions below, so it is deterministic and reproducible.
#   explicit
#       Author the binary rules directly under `rules` instead.
abac_baseline:
  description: >-
    Deterministic attribute-based access control evaluating user role, operation
    type, resource sensitivity and destination classification.  Binary output
    only: ALLOW or DENY.  No escalation state.
  binary_only: true
  attributes: [role, tool, sensitivity, destination]
  rules_source: ground_truth_projection
  # Design decision 1 of 2.  A binary mechanism cannot represent the ground-truth
  # ESCALATE state, so every escalation rule is forced to a binary outcome.
  # DENY is fail-closed: an action that the independent policy says needs
  # additional authorisation is not executed without it.  The alternative,
  # ALLOW, is available for the usability-cost variant of the baseline; changing
  # it changes no ground-truth label and no risk-model value.
  escalation_collapse: DENY
  # Design decision 2 of 2.  The baseline cannot observe context_risk, so it
  # evaluates the policy as if the supplied contextual condition were benign.
  # Rules that only fire on a detected contextual deviation (UNUSUAL,
  # HIGH_VOLUME, ANOMALOUS) are therefore inapplicable to it and are not
  # projected.
  context_assumption: NORMAL
  # Outcome for scenarios matched by no rule.  This is a policy decision and is
  # therefore authored explicitly rather than defaulted in code.  Fail-closed,
  # consistent with GT-D999 in the ground-truth matrix.
  default_decision: DENY
  # Explicit binary rules.  Empty here because the rule set is derived by
  # `rules_source: ground_truth_projection`; any rule authored here would be
  # merged in after the projected rules and would have to obey the same
  # precedence ordering.
  rules: []

# -----------------------------------------------------------------------------
# 6. Metrics inputs
# -----------------------------------------------------------------------------
metrics:
  # Section IV.E.3 defines the unnecessary-escalation rate over "low-risk
  # legitimate actions" without fixing what counts as low risk.  Record the
  # agreed designation here before the primary experiment is analysed.
  low_risk_definition: null
  low_risk_context_risks: null
  low_risk_max_score: null
  source: "draft section IV.E.3 leaves the low-risk designation open"
